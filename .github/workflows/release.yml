name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build binaries
        run: |
          chmod +x ./build.sh
          # Embed the tag as the version, without the leading "v".
          VERSION="${GITHUB_REF_NAME#v}" ./build.sh

      - name: Package release bundles
        run: |
          chmod +x ./package.sh
          ./package.sh

      - name: Create Release
        id: create_release
        if: github.ref_type == 'tag' && github.actor != 'nektos/act'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/*.tar.gz
            build/*.zip
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
